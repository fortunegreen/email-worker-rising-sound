name = "email-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "email-worker-db"
database_id = "89ce4a7d-4d20-4584-8782-1f98156ada2d"

[vars]
# Switch providers by changing this one line — no code changes required.
# Options: "console" (logs only, safe default), "resend", "postmark", "sendgrid"
EMAIL_PROVIDER = "resend"
DEFAULT_FROM_ADDRESS = "hello@news.risingsoundwa.com.au"
  STRIPE_PRICE_MEMBER = "price_1UIfAK23DnUymzhvbf6cHQ8n"
  STRIPE_PRICE_CHAMPION = "price_1UIfAt23DnUymzhv558dU8Rg"

# Secrets are NOT set here. Set only the one(s) you need with:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put POSTMARK_SERVER_TOKEN
#   wrangler secret put SENDGRID_API_KEY
#   wrangler secret put API_SECRET   <- required; callers must send this in the x-api-key header
#
# /subscribe also needs RESEND_AUDIENCE_ID set (see README) — create an
# Audience in the Resend dashboard first, then set its id as a var below
# (not a secret; it's not sensitive, just an identifier):
RESEND_AUDIENCE_ID = "547f5650-d14b-4214-a335-eede3cbeaa9b"
RESEND_MEMBERS_AUDIENCE_ID = "f46e65c1-2e11-4103-aaf3-7d0cc6d5a920"
